[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-insights-backend"
version = "0.1.0"
description = "FastAPI backend for the Satellite-to-Insights platform"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # HTTP client
    "httpx>=0.27",
    # Data validation
    "pydantic>=2.7",
    # IBM watsonx / Granite
    "ibm-watsonx-ai>=0.2.6",
    "langchain-ibm>=0.1.7",
    # LangChain orchestration
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-community>=0.2",
    # Vector store
    "chromadb>=0.5",
    # Numerical / geospatial
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",          # for TestClient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
